name: giani-reporter

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_URL: /api
    image: giani-newsroom-web:${NEWSROOM_WEB_IMAGE_TAG:-local}
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  newsroom:
    build:
      context: ..
      dockerfile: infra/Dockerfile.newsroom
    image: giani-newsroom:${NEWSROOM_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    environment:
      NEWSROOM_DATA_DIR: /data
      NEWSROOM_ASSETS_DIR: /data/media
      NEWSROOM_SOURCE_ASSETS_DIR: /source-assets
      NEWSROOM_DATABASE_PATH: /data/newsroom.sqlite3
      NEWSROOM_LIVE_RESEARCH: ${NEWSROOM_LIVE_RESEARCH:-true}
      NEWSROOM_REQUEST_TIMEOUT_SECONDS: ${NEWSROOM_REQUEST_TIMEOUT_SECONDS:-12}
      NEWSROOM_CORS_ORIGINS: ${NEWSROOM_CORS_ORIGINS:-}
      NEWSROOM_SITE: ${NEWSROOM_SITE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      # Post Studio: image generation
      NEWSROOM_IMAGE_PROVIDER: ${NEWSROOM_IMAGE_PROVIDER:-auto}
      NEWSROOM_IMAGE_TIMEOUT_SECONDS: ${NEWSROOM_IMAGE_TIMEOUT_SECONDS:-120}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}
      IMAGEN_MODEL: ${IMAGEN_MODEL:-imagen-4.0-generate-001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_MODEL: ${REPLICATE_MODEL:-black-forest-labs/flux-1.1-pro}
      # Post Studio: public media hosting for Instagram's fetchers
      NEWSROOM_MEDIA_HOST: ${NEWSROOM_MEDIA_HOST:-local}
      NEWSROOM_PUBLIC_BASE_URL: ${NEWSROOM_PUBLIC_BASE_URL:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-giani/posts}
      # Post Studio: Instagram / Meta publishing
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      INSTAGRAM_LOGIN_MODE: ${INSTAGRAM_LOGIN_MODE:-facebook}
      INSTAGRAM_GRAPH_VERSION: ${INSTAGRAM_GRAPH_VERSION:-v21.0}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-${META_ACCESS_TOKEN:-}}
      INSTAGRAM_PUBLISH_ENABLED: ${INSTAGRAM_PUBLISH_ENABLED:-false}
      INSTAGRAM_DAILY_POST_LIMIT: ${INSTAGRAM_DAILY_POST_LIMIT:-5}
    volumes:
      - newsroom_data:/data
      - ../assets:/source-assets:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 20s
    networks:
      - backend

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.30.5}
    init: true
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:?Set N8N_HOST in infra/.env}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:?Set N8N_EDITOR_BASE_URL in infra/.env}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?Set N8N_WEBHOOK_URL in infra/.env}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Generate N8N_ENCRYPTION_KEY in infra/.env}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?Generate N8N_USER_MANAGEMENT_JWT_SECRET in infra/.env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS:-336}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      NEWSROOM_INTERNAL_URL: http://newsroom:8000
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/opt/giani/workflows:ro
    expose:
      - "5678"
    depends_on:
      newsroom:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s
    networks:
      - backend

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine}
    restart: unless-stopped
    environment:
      NEWSROOM_SITE: ${NEWSROOM_SITE:?Set NEWSROOM_SITE in infra/.env}
      N8N_SITE: ${N8N_SITE:?Set N8N_SITE in infra/.env}
      NEWSROOM_BASIC_AUTH_USER: ${NEWSROOM_BASIC_AUTH_USER:?Set NEWSROOM_BASIC_AUTH_USER in infra/.env}
      NEWSROOM_BASIC_AUTH_HASH: ${NEWSROOM_BASIC_AUTH_HASH:?Set NEWSROOM_BASIC_AUTH_HASH in infra/.env}
      N8N_GATE_USER: ${N8N_GATE_USER:?Set N8N_GATE_USER in infra/.env}
      N8N_GATE_HASH: ${N8N_GATE_HASH:?Set N8N_GATE_HASH in infra/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      newsroom:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 8s
      retries: 3
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  newsroom_data:
  n8n_data:
  caddy_data:
  caddy_config:
